<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="100%" height="100%" fill="none">
  <!-- Yellow Heavy stylized 'G' -->
  <g transform="translate(10, 10)">
    <!-- Main Outer G Shape -->
    <path d="M 85 0 
             C 40 0, 0 35, 0 72 
             C 0 108, 38 120, 85 120 
             C 120 120, 138 102, 138 78 
             L 138 52 
             L 65 52 
             L 65 72 
             L 112 72 
             L 112 78 
             C 112 92, 100 100, 85 100 
             C 52 100, 26 84, 26 72 
             C 26 48, 52 20, 85 20 
             C 105 20, 120 30, 128 42 
             L 142 28 
             C 128 10, 108 0, 85 0 Z" fill="#FFCC00" />
  </g>

  <!-- White Block 'P E R Y A' Typography -->
  <g fill="#FFFFFF" transform="translate(160, 22)">
    <!-- P -->
    <path d="M 0 0 L 42 0 C 58 0, 68 8, 68 22 C 68 36, 58 44, 42 44 L 20 44 L 20 96 L 0 96 Z M 20 18 L 20 26 L 40 26 C 46 26, 48 24, 48 22 C 48 20, 46 18, 40 18 Z" />
    
    <!-- E -->
    <path d="M 78 0 L 132 0 L 132 18 L 98 18 L 98 38 L 126 38 L 126 56 L 98 56 L 98 78 L 132 78 L 132 96 L 78 96 Z" />
    
    <!-- R -->
    <path d="M 142 0 L 186 0 C 202 0, 212 8, 212 22 C 212 34, 204 40, 192 43 L 216 96 L 194 96 L 172 46 L 162 46 L 162 96 L 142 96 Z M 162 18 L 162 28 L 184 28 C 190 28, 192 26, 192 23 C 192 20, 190 18, 184 18 Z" />
    
    <!-- Y -->
    <path d="M 222 0 L 244 0 L 258 42 L 272 0 L 294 0 L 268 56 L 268 96 L 248 96 L 248 56 Z" />
    
    <!-- A -->
    <path d="M 314 0 L 338 0 L 364 96 L 342 96 L 335 70 L 307 70 L 300 96 L 278 96 Z M 312 52 L 330 52 L 321 20 Z" />
  </g>

  <!-- Pixelated / Retro Style White Rooster Mascot -->
  <g fill="#FFFFFF" transform="translate(515, 8)">
    <!-- Comb (Spiky Top Feathers) -->
    <rect x="24" y="0" width="8" height="12" />
    <rect x="16" y="4" width="8" height="12" />
    <rect x="32" y="4" width="8" height="12" />
    <rect x="8" y="10" width="8" height="10" />

    <!-- Head & Fluffy Pixel Hair -->
    <rect x="12" y="18" width="32" height="24" />
    <rect x="4" y="22" width="8" height="16" />
    <rect x="44" y="22" width="8" height="16" />
    
    <!-- Eye (Black Pixel) -->
    <rect x="28" y="26" width="4" height="4" fill="#000000" />

    <!-- Beak -->
    <rect x="38" y="30" width="10" height="6" />

    <!-- Body & Fluff -->
    <rect x="16" y="42" width="28" height="32" />
    <rect x="8" y="48" width="8" height="20" />
    <rect x="44" y="46" width="12" height="24" />

    <!-- Wings (Up & Outward) -->
    <rect x="48" y="26" width="10" height="12" />
    <rect x="56" y="20" width="10" height="14" />
    <rect x="64" y="16" width="12" height="16" />
    <rect x="52" y="42" width="16" height="12" />

    <!-- Tail Feathers -->
    <rect x="0" y="40" width="8" height="16" />
    <rect x="-6" y="46" width="8" height="14" />

    <!-- Legs & Feet -->
    <rect x="20" y="74" width="4" height="12" />
    <rect x="32" y="74" width="4" height="12" />

    <rect x="14" y="86" width="14" height="4" />
    <rect x="28" y="86" width="14" height="4" />
  </g>
</svg>
