<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-payout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022018"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#02150f"/>
    </linearGradient>
    <linearGradient id="gold-accent-payout" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="gcash-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <linearGradient id="maya-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#1DE9B6"/>
    </linearGradient>
    <filter id="shadow-payout" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-grad-payout)"/>

  <!-- Geometric Glowing Rings -->
  <circle cx="620" cy="225" r="170" fill="none" stroke="#00E676" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="620" cy="225" r="110" fill="none" stroke="#FFC107" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Left Side Text & Badges -->
  <g transform="translate(60, 130)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#059669"/>
    <text x="75" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">PAYOUT GUIDES</text>

    <!-- Title Lines -->
    <text x="0" y="80" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34">Gperya Withdrawal</text>
    <text x="0" y="122" fill="url(#gold-accent-payout)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34">Pending Status &amp; KYC</text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">GCash, Maya name checks, turnover rules &amp; fast payout fixes</text>
  </g>

  <!-- Right Side Visual Illustration: Wallet + Payment Badges -->
  <g transform="translate(500, 100)" filter="url(#shadow-payout)">
    <!-- Wallet Card Base -->
    <rect x="0" y="40" width="230" height="150" rx="18" fill="#065f46" stroke="url(#gold-accent-payout)" stroke-width="3"/>
    <rect x="0" y="70" width="230" height="25" fill="#022018"/>
    
    <!-- Wallet Chip & Cash Symbol -->
    <rect x="25" y="110" width="36" height="28" rx="5" fill="#FFC107"/>
    <circle cx="180" cy="125" r="18" fill="#10B981"/>
    <text x="180" y="132" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle">₱</text>

    <!-- GCash Floating Badge -->
    <g transform="translate(-30, 0)">
      <rect x="0" y="0" width="130" height="46" rx="12" fill="url(#gcash-blue)" stroke="#FFFFFF" stroke-width="2"/>
      <text x="65" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">GCash</text>
    </g>

    <!-- Maya Floating Badge -->
    <g transform="translate(130, 150)">
      <rect x="0" y="0" width="120" height="46" rx="12" fill="url(#maya-green)" stroke="#FFFFFF" stroke-width="2"/>
      <text x="60" y="28" fill="#064e3b" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">Maya</text>
    </g>

    <!-- Success Checkmark Badge -->
    <g transform="translate(85, 170)">
      <circle cx="25" cy="25" r="25" fill="#FFC107" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M16 25 L22 31 L34 17" fill="none" stroke="#022018" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Bottom Brand Ribbon -->
  <rect x="0" y="410" width="800" height="40" fill="#01140e"/>
  <text x="60" y="435" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">GperyaPH Official Financial Security Guide • 2026</text>
</svg>
