<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="30%" stop-color="#FBC02D"/>
      <stop offset="70%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#795548"/>
    </linearGradient>
    <linearGradient id="center-hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring Shadow & Glow -->
  <circle cx="60" cy="60" r="58" fill="#1a0008" stroke="url(#gold-rim)" stroke-width="4"/>

  <!-- Rotating Roulette Wheel Group -->
  <g transform-origin="60 60">
    <!-- Wheel Base -->
    <circle cx="60" cy="60" r="52" fill="#2d020d"/>

    <!-- Red, Black & Green Slots -->
    <path d="M60,60 L60,10 A50,50 0 0,1 79.13,13.78 Z" fill="#00e676"/>
    <path d="M60,60 L79.13,13.78 A50,50 0 0,1 95.35,24.65 Z" fill="#d50000"/>
    <path d="M60,60 L95.35,24.65 A50,50 0 0,1 106.22,40.87 Z" fill="#212121"/>
    <path d="M60,60 L106.22,40.87 A50,50 0 0,1 110,60 Z" fill="#d50000"/>
    <path d="M60,60 L110,60 A50,50 0 0,1 106.22,79.13 Z" fill="#212121"/>
    <path d="M60,60 L106.22,79.13 A50,50 0 0,1 95.35,95.35 Z" fill="#d50000"/>
    <path d="M60,60 L95.35,95.35 A50,50 0 0,1 79.13,106.22 Z" fill="#212121"/>
    <path d="M60,60 L79.13,106.22 A50,50 0 0,1 60,110 Z" fill="#d50000"/>
    <path d="M60,60 L60,110 A50,50 0 0,1 40.87,106.22 Z" fill="#00e676"/>
    <path d="M60,60 L40.87,106.22 A50,50 0 0,1 24.65,95.35 Z" fill="#212121"/>
    <path d="M60,60 L24.65,95.35 A50,50 0 0,1 13.78,79.13 Z" fill="#d50000"/>
    <path d="M60,60 L13.78,79.13 A50,50 0 0,1 10,60 Z" fill="#212121"/>
    <path d="M60,60 L10,60 A50,50 0 0,1 13.78,40.87 Z" fill="#d50000"/>
    <path d="M60,60 L13.78,40.87 A50,50 0 0,1 24.65,24.65 Z" fill="#212121"/>
    <path d="M60,60 L24.65,24.65 A50,50 0 0,1 40.87,13.78 Z" fill="#d50000"/>
    <path d="M60,60 L40.87,13.78 A50,50 0 0,1 60,10 Z" fill="#212121"/>

    <!-- Inner Metallic Ring -->
    <circle cx="60" cy="60" r="32" fill="none" stroke="url(#gold-rim)" stroke-width="3"/>

    <!-- Center Turret Handles -->
    <circle cx="60" cy="60" r="18" fill="url(#center-hub)"/>
    <path d="M60,35 L60,85 M35,60 L85,60" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="8" fill="#FFF59D"/>
    <circle cx="60" cy="60" r="4" fill="#2d020d"/>

    <!-- Ball -->
    <circle cx="82" cy="42" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="0.5"/>
  </g>

  <!-- Outer Fixed Frame Rim -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#gold-rim)" stroke-width="3"/>
</svg>
