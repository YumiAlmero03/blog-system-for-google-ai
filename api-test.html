<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Game List</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:20px}
    .game{display:flex;align-items:center;margin:10px 0;padding:8px;border-bottom:1px solid #eee}
    .thumb{width:96px;height:64px;object-fit:cover;margin-right:12px;background:#f5f5f5}
    #status{margin-bottom:12px;color:#333}
  </style>
</head>
<body>
  <h1>Games test api helo</h1>
  <div id="status">Starting...</div>
  <div id="list"></div>
  <iframe title="Demo 1" id="game-jili" width="100%" frameborder="0" allowfullscreen="" allow="fullscreen" src="https://demogamesfree.slanyywbug.net/gs2c/openGame.do?gameSymbol=vs20olympgate&lang=en&stylename=g128pr_bybet&treq=CjX1N3gHf0XA1dHi970KthvH7UAsqZdr6YRyRwOgYnjOgQeLmoyPu6zTCsFPPF96&isGameUrlApiCalled=true&userId=demoPlayer"></iframe>
  <iframe src="https://slotslaunch.com/iframe/5337?token=KljjshkJEwm9XlVUTiGCzsyYkQw4mG22pOKNzS3enaABIHoTdj" style="width:100%;height:400px;border:1px solid #ccc;"></iframe>
  <iframe
    src="https://gperya-apk.com/game/wild-water/"
    width="100%"
    height="720"
    style="border:0;"
    loading="lazy"
    allow="fullscreen; autoplay"
    allowfullscreen>
  </iframe>
  <script>
    const token = 'KljjshkJEwm9XlVUTiGCzsyYkQw4mG22pOKNzS3enaABIHoTdj';
    const API_URL = 'https://slotslaunch.com/api/games?token=' + token;

    async function loadGames(){
      const status = document.getElementById('status');
      const list = document.getElementById('list');
      status.textContent = 'Fetching games...';
      try{
        const res = await fetch(API_URL, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', 'Origin': 'gperya-apk.com' } });
        if(!res.ok) throw new Error(res.status + ' ' + res.statusText);
        const data = await res.json();

        // Support a few common response shapes
        const games = Array.isArray(data) ? data : (Array.isArray(data.games) ? data.games : (Array.isArray(data.data) ? data.data : null));

        if(!games){
          status.textContent = 'Fetched (raw JSON)';
          list.textContent = JSON.stringify(data, null, 2);
          return;
        }

        status.textContent = 'Found ' + games.length + ' games';
        list.innerHTML = '';

        games.forEach(g => {
          const div = document.createElement('div'); div.className = 'game';
          const img = document.createElement('img'); img.className = 'thumb';
          img.src = g.image || g.thumbnail || g.icon || '';
          img.alt = g.name || g.title || '';
          div.appendChild(img);

          const info = document.createElement('div');
          const title = document.createElement('div'); title.textContent = g.name || g.title || 'Untitled';
          const sub = document.createElement('div'); sub.style.fontSize = '12px'; sub.style.color = '#666';
          sub.textContent = g.provider_name || g.provider || g.id || '';
          info.appendChild(title); info.appendChild(sub);

          div.appendChild(info);
          list.appendChild(div);
        });

      }catch(err){
        status.textContent = 'Error: ' + err.message;
        list.textContent = '';
      }
    }

    document.addEventListener('DOMContentLoaded', loadGames);
  </script>
</body>
</html>
