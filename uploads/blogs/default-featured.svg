<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-def" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120108"/>
      <stop offset="50%" stop-color="#2a0512"/>
      <stop offset="100%" stop-color="#0e0106"/>
    </linearGradient>
    <linearGradient id="gold-accent-def" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="shadow-def" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-grad-def)"/>

  <!-- Decorative Rings -->
  <circle cx="620" cy="225" r="160" fill="none" stroke="#FFC107" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="620" cy="225" r="100" fill="none" stroke="#FFC107" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Left Side Text & Badges -->
  <g transform="translate(60, 130)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#FFC107"/>
    <text x="80" y="22" fill="#120108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="1">GPERYA FEATURED</text>

    <!-- Title Lines -->
    <text x="0" y="80" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36">Official GperyaPH</text>
    <text x="0" y="124" fill="url(#gold-accent-def)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36">Gaming &amp; Casino Guide</text>

    <!-- Subtitle -->
    <text x="0" y="168" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">Tips, strategies, bonuses &amp; safe gaming tutorials for players</text>
  </g>

  <!-- Right Side Visual Slot Character / Trophy Badge -->
  <g transform="translate(500, 110)" filter="url(#shadow-def)">
    <circle cx="100" cy="100" r="90" fill="#3b0818" stroke="url(#gold-accent-def)" stroke-width="4"/>
    <text x="100" y="118" fill="#FFC107" font-size="70" text-anchor="middle">🎰</text>
  </g>

  <!-- Bottom Brand Ribbon -->
  <rect x="0" y="410" width="800" height="40" fill="#080004"/>
  <text x="60" y="435" fill="#FFC107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">GperyaPH Official Blog • Uploads Directory</text>
</svg>
